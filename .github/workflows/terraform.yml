name: terraform

# Static checks only. There is intentionally no plan/apply or deployment workflow and no AWS credentials.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "src/claims_investigator/tools/tool_definitions.json"
      - ".checkov.yaml"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - "src/claims_investigator/tools/tool_definitions.json"
      - ".checkov.yaml"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.1"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      # init -backend=false with the committed lock files; no AWS access is needed.
      - name: terraform validate (bootstrap, dev, prod)
        run: scripts/sh/tf_validate.sh

  checkov:
    name: IaC security scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bridgecrewio/checkov-action@2f9fbe2d1e51440f8f5c42abc829aad8e9e4faab # v12.3127.0
        with:
          directory: infra
          framework: terraform
          config_file: .checkov.yaml
          compact: true
          quiet: true
